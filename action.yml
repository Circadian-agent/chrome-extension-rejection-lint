# A GitHub Action wrapper around the same linter the CLI runs.
#
# Composite rather than Docker on purpose: the package has no dependencies and
# needs no build, so a container would add a pull and a minute of cold start to a
# check that finishes in well under a second. Every runner already has node.
#
# There is deliberately no shell logic below beyond calling one file. Shell in a
# composite action cannot be exercised by the test suite, and it breaks on
# somebody else's runner where nobody can see it. action/report.mjs holds the
# behaviour and test/action.test.mjs covers it.
name: "webstore-lint"
# GITHUB MARKETPLACE CAPS THIS AT 125 CHARACTERS and refuses the whole publish
# until it fits (2026-07-31: the owner tried to tick the Marketplace box and got
# "Description must be less than 125 characters" - the only thing the form
# objected to). The old wording was 237. test/action.test.mjs measures the real
# file so the limit is enforced here rather than remembered.
#
# It is also SEARCH COPY, not just metadata: the Marketplace listing is indexed
# by GitHub search, so this reuses what s065 measured on repository search - a
# developer in trouble types "rejection" and "rejected", never "program
# policies". That is why the short version leads with the rejection and not with
# the linting.
#
# THE WORD "EXTENSION" IS IN HERE ON PURPOSE, and it was missing until s141.
# Marketplace search indexes the listing NAME and THIS LINE, and nothing else we
# could find - measured, with the readings that separate the three candidates:
#
#   "exact policy quoted"              rank 1   phrase only in this description
#   "chrome-extension-rejection-lint"  ABSENT   the repo slug is not indexed
#   "chrome web store"                 rank 16  every word of it is in here
#   "chrome extension"                 ABSENT from all 26 listings, not just
#                                      page one - so it was a missing word
#                                      rather than a low rank
#
# The listing is called webstore-lint and the old description said "Chrome" and
# "Web Store" but never "extension", so the single broadest query our audience
# types returned 26 other actions and none of ours. The top results for it are
# the UPLOAD actions, which is to say: people who already publish to the store
# from CI, one step away from wanting this. Both verbs are here for the same
# reason - the store calls it submit and a workflow calls it publish.
#
# RE-MEASURE BEFORE BELIEVING THIS WORKED. The Marketplace index is not ours and
# nothing here proves it re-reads a description on a new release.
description: "Catch Chrome Web Store rejections before you submit or publish an extension. Findings quote the exact policy. 2026 rules."
author: "Circadian-agent"

branding:
  icon: "shield"
  color: "yellow"

inputs:
  path:
    description: "Directory holding manifest.json, or the unzipped package."
    required: false
    default: "."
  fail-on:
    description: >-
      Which findings fail the step. "fail" (default) blocks only on policy
      violations, matching the CLI's exit code. "warn" also blocks on findings
      that need a human judgement. "never" reports without blocking. An
      unreadable extension fails whatever this is set to, because nothing was
      checked and a green check would be a lie.
    required: false
    default: "fail"
  privacy-policy:
    description: >-
      Optional. Your store listing's privacy policy URL. Passing it adds a check
      that the page actually answers. This is the only input that makes a network
      request, and only when it is set.
    required: false
    default: ""
  annotations:
    description: >-
      Write findings as inline annotations on the pull request diff. Set to
      "false" for the job summary only.
    required: false
    default: "true"

outputs:
  fail:
    description: "Number of failing findings."
    value: ${{ steps.lint.outputs.fail }}
  warn:
    description: "Number of findings needing a human judgement."
    value: ${{ steps.lint.outputs.warn }}
  info:
    description: "Number of informational findings."
    value: ${{ steps.lint.outputs.info }}
  unreadable:
    description: >-
      "true" when the extension could not be read, so no policy check ran. This
      is distinct from a clean result and the two must not be confused.
    value: ${{ steps.lint.outputs.unreadable }}

runs:
  using: "composite"
  steps:
    - id: lint
      shell: bash
      run: node "$GITHUB_ACTION_PATH/action/report.mjs"
      env:
        WSL_PATH: ${{ inputs.path }}
        WSL_FAIL_ON: ${{ inputs.fail-on }}
        WSL_PRIVACY_POLICY: ${{ inputs.privacy-policy }}
        WSL_ANNOTATIONS: ${{ inputs.annotations }}
